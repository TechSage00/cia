<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#9d174d">
<title>To My Favorite Person ❤️</title>

<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    font-family: Georgia, "Times New Roman", serif;
    overflow-x: hidden;
    color: #fff;
    background: #5b102d;
  }

  body {
    min-height: 100svh;
    position: relative;
    background:
      radial-gradient(circle at 20% 15%, rgba(255,255,255,.18), transparent 28%),
      radial-gradient(circle at 85% 80%, rgba(255,145,185,.18), transparent 30%),
      linear-gradient(145deg, #3d0922, #8f174d 48%, #c53b6f 100%);
    isolation: isolate;
  }

  body::before,
  body::after {
    content: "";
    position: fixed;
    inset: -25%;
    z-index: -2;
    pointer-events: none;
    background: radial-gradient(circle, rgba(255,255,255,.08), transparent 42%);
    animation: backgroundDrift 12s ease-in-out infinite alternate;
  }

  body::after {
    animation-duration: 17s;
    animation-direction: alternate-reverse;
    opacity: .7;
  }

  @keyframes backgroundDrift {
    from { transform: translate3d(-5%, -3%, 0) scale(1); }
    to   { transform: translate3d(5%, 4%, 0) scale(1.12); }
  }

  .page {
    min-height: 100svh;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 16px 34px;
    position: relative;
    z-index: 2;
  }

  .headline {
    text-align: center;
    margin: 8px 0 18px;
    animation: titleIn 1s cubic-bezier(.2,.8,.2,1) both;
  }

  .headline .small {
    display: block;
    font: 700 11px/1.2 Arial, sans-serif;
    letter-spacing: 4px;
    text-transform: uppercase;
    opacity: .78;
    margin-bottom: 8px;
  }

  .headline h1 {
    margin: 0;
    font-size: clamp(30px, 8vw, 48px);
    line-height: 1.05;
    text-shadow: 0 4px 22px rgba(0,0,0,.25);
  }

  @keyframes titleIn {
    from { opacity: 0; transform: translateY(-24px) scale(.94); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .photo-wrap {
    width: min(78vw, 310px);
    position: relative;
    margin: 4px 0 22px;
    animation: photoPop 1.05s .2s cubic-bezier(.16,1,.3,1) both;
  }

  @keyframes photoPop {
    0%   { opacity: 0; transform: scale(.55) rotate(-4deg); }
    65%  { opacity: 1; transform: scale(1.06) rotate(1.5deg); }
    100% { opacity: 1; transform: scale(1) rotate(0); }
  }

  .photo-card {
    position: relative;
    padding: 11px 11px 35px;
    border-radius: 7px;
    background: rgba(255,255,255,.96);
    box-shadow:
      0 24px 55px rgba(24,0,12,.38),
      0 0 0 1px rgba(255,255,255,.45);
    transform: rotate(-1deg);
  }

  .photo-card::before {
    content: "";
    position: absolute;
    inset: -8px;
    z-index: -1;
    border-radius: 15px;
    background: rgba(255,112,163,.42);
    filter: blur(18px);
    animation: glow 2.8s ease-in-out infinite alternate;
  }

  @keyframes glow {
    from { opacity: .45; transform: scale(.97); }
    to   { opacity: .9; transform: scale(1.04); }
  }

  .photo-card img {
    display: block;
    width: 100%;
    aspect-ratio: 4 / 5;
    object-fit: cover;
    border-radius: 3px;
    background: linear-gradient(135deg, #ffd7e5, #f49abb);
  }

  .photo-caption {
    position: absolute;
    bottom: 9px;
    left: 0;
    right: 0;
    color: #6b173b;
    text-align: center;
    font-size: 17px;
    font-weight: bold;
  }

  .heart-frame {
    position: absolute;
    inset: -22px;
    pointer-events: none;
  }

  .heart-frame span {
    position: absolute;
    font-size: 18px;
    animation: twinkle 2s ease-in-out infinite;
  }

  .heart-frame span:nth-child(1) { left: 2%; top: 23%; }
  .heart-frame span:nth-child(2) { right: 1%; top: 35%; animation-delay: .4s; }
  .heart-frame span:nth-child(3) { left: 8%; bottom: 13%; animation-delay: .8s; }
  .heart-frame span:nth-child(4) { right: 8%; bottom: 8%; animation-delay: 1.2s; }

  @keyframes twinkle {
    0%,100% { transform: scale(.75) rotate(-8deg); opacity: .45; }
    50% { transform: scale(1.25) rotate(8deg); opacity: 1; }
  }

  .glass {
    width: min(92vw, 430px);
    padding: 20px 18px 18px;
    border: 1px solid rgba(255,255,255,.3);
    border-radius: 24px;
    background: rgba(255,255,255,.12);
    box-shadow: 0 18px 45px rgba(25,0,12,.2);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    text-align: center;
    animation: cardIn .9s .65s ease both;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(25px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .glass p {
    margin: 0 0 17px;
    font-size: 16px;
    line-height: 1.6;
    text-shadow: 0 2px 8px rgba(0,0,0,.18);
  }

  .heart-button {
    border: 0;
    color: white;
    cursor: pointer;
    width: 78px;
    height: 70px;
    margin: 0 auto;
    display: grid;
    place-items: center;
    background: transparent;
    position: relative;
    font: 700 11px/1.1 Arial, sans-serif;
    filter: drop-shadow(0 8px 13px rgba(50,0,20,.3));
    transition: transform .2s ease;
  }

  .heart-button::before {
    content: "♥";
    position: absolute;
    font-size: 76px;
    line-height: 1;
    color: #f04f82;
    text-shadow: 0 0 18px rgba(255,126,169,.75);
    z-index: -1;
  }

  .heart-button:hover { transform: scale(1.08); }
  .heart-button:active { transform: scale(.92); }

  .heart-button span {
    position: relative;
    z-index: 1;
    max-width: 54px;
  }

  .hint {
    margin-top: 13px !important;
    margin-bottom: 0 !important;
    font: 11px/1.4 Arial, sans-serif;
    opacity: .65;
  }

  /* Floating hearts */
  #hearts, #bursts {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 1;
  }

  .float-heart {
    position: absolute;
    bottom: -45px;
    left: var(--x);
    font-size: var(--size);
    color: var(--color);
    opacity: var(--opacity);
    filter: drop-shadow(0 4px 7px rgba(50,0,20,.22));
    animation: floatUp var(--duration) linear forwards;
    transform: rotate(var(--rotate));
  }

  @keyframes floatUp {
    0% {
      transform: translate3d(0, 0, 0) rotate(var(--rotate)) scale(.75);
      opacity: 0;
    }
    12% { opacity: var(--opacity); }
    50% {
      transform: translate3d(var(--drift), -50vh, 0) rotate(calc(var(--rotate) + 18deg)) scale(1);
    }
    100% {
      transform: translate3d(calc(var(--drift) * -0.35), -115vh, 0) rotate(calc(var(--rotate) - 15deg)) scale(.7);
      opacity: 0;
    }
  }

  .burst-heart {
    position: fixed;
    left: var(--x);
    top: var(--y);
    font-size: var(--size);
    color: #ff9bbb;
    text-shadow: 0 0 8px rgba(255,255,255,.6);
    animation: burst .75s cubic-bezier(.2,.8,.2,1) forwards;
  }

  @keyframes burst {
    from {
      transform: translate(-50%, -50%) scale(.2);
      opacity: 1;
    }
    to {
      transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(.9) rotate(30deg);
      opacity: 0;
    }
  }

  /* Decorative Cupid-style SVG */
  .cupid {
    position: fixed;
    width: 90px;
    height: 90px;
    z-index: 3;
    pointer-events: none;
    opacity: 0;
    animation: cupidFlight 10s linear infinite;
  }

  .cupid svg {
    width: 100%;
    height: 100%;
    overflow: visible;
    filter: drop-shadow(0 5px 8px rgba(50,0,20,.25));
  }

  @keyframes cupidFlight {
    0%   { left: -110px; top: 13%; opacity: 0; transform: rotate(-8deg) scale(.75); }
    8%   { opacity: .9; }
    45%  { transform: rotate(8deg) scale(1); }
    92%  { opacity: .85; }
    100% { left: calc(100vw + 110px); top: 28%; opacity: 0; transform: rotate(-5deg) scale(.8); }
  }

  .cupid.two {
    animation-delay: 5.5s;
    animation-duration: 11s;
    transform: scale(.78);
  }

  /* Modal */
  .modal {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: grid;
    place-items: center;
    padding: 20px;
    background: rgba(38,0,17,.58);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    opacity: 0;
    visibility: hidden;
    transition: opacity .3s ease, visibility .3s ease;
  }

  .modal.open {
    opacity: 1;
    visibility: visible;
  }

  .message-card {
    width: min(92vw, 390px);
    border-radius: 28px;
    padding: 27px 22px 22px;
    text-align: center;
    background: linear-gradient(145deg, rgba(255,245,249,.98), rgba(255,222,234,.97));
    color: #641536;
    box-shadow: 0 25px 70px rgba(0,0,0,.35);
    transform: translateY(20px) scale(.92);
    transition: transform .35s cubic-bezier(.2,.9,.2,1);
  }

  .modal.open .message-card {
    transform: translateY(0) scale(1);
  }

  .message-card .big-heart {
    font-size: 48px;
    animation: heartbeat 1.1s ease-in-out infinite;
  }

  @keyframes heartbeat {
    0%,100% { transform: scale(1); }
    20% { transform: scale(1.14); }
    35% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }

  .message-card h2 {
    margin: 8px 0 13px;
    font-size: 27px;
  }

  #typedMessage {
    min-height: 110px;
    margin: 0;
    font-size: 16px;
    line-height: 1.65;
  }

  .close {
    margin-top: 16px;
    border: 0;
    border-radius: 999px;
    padding: 11px 20px;
    background: #8f174d;
    color: white;
    font-weight: bold;
    cursor: pointer;
  }

  .sparkle {
    position: fixed;
    pointer-events: none;
    z-index: 4;
    font-size: 13px;
    animation: sparkleOut .9s ease forwards;
  }

  @keyframes sparkleOut {
    from { transform: scale(.3); opacity: 0; }
    30% { opacity: 1; }
    to { transform: translateY(-25px) scale(1.2); opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      scroll-behavior: auto !important;
    }
  }

  @media (max-height: 700px) {
    .page { padding-top: 14px; }
    .headline { margin-bottom: 10px; }
    .photo-wrap { width: min(58vw, 245px); margin-bottom: 12px; }
    .glass { padding: 13px 15px; }
  }
</style>
</head>

<body>
  <div id="hearts"></div>
  <div id="bursts"></div>

  <!-- Decorative flying Cupid-style illustration -->
  <div class="cupid" aria-hidden="true">
    <svg viewBox="0 0 120 100">
      <g fill="none" stroke="#ffd6e5" stroke-width="4" stroke-linecap="round">
        <path d="M39 39 Q18 20 10 39 Q17 51 38 50"/>
        <path d="M74 40 Q99 20 111 40 Q102 53 76 50"/>
      </g>
      <circle cx="59" cy="28" r="10" fill="#ffd6e5"/>
      <path d="M48 42 Q60 32 72 42 L69 70 Q60 79 51 70Z" fill="#ffd6e5"/>
      <path d="M52 69 L44 84 M68 69 L76 84" stroke="#ffd6e5" stroke-width="5" stroke-linecap="round"/>
      <path d="M72 48 L103 26" stroke="#ffd6e5" stroke-width="4"/>
      <path d="M98 23 L108 20 L103 29" fill="none" stroke="#ffd6e5" stroke-width="3"/>
      <path d="M53 47 Q59 53 65 47" stroke="#b52b61" stroke-width="2"/>
      <circle cx="55" cy="27" r="2" fill="#b52b61" stroke="none"/>
      <circle cx="63" cy="27" r="2" fill="#b52b61" stroke="none"/>
    </svg>
  </div>

  <div class="cupid two" aria-hidden="true">
    <svg viewBox="0 0 120 100">
      <g fill="none" stroke="#fff0f5" stroke-width="4" stroke-linecap="round">
        <path d="M39 39 Q18 20 10 39 Q17 51 38 50"/>
        <path d="M74 40 Q99 20 111 40 Q102 53 76 50"/>
      </g>
      <circle cx="59" cy="28" r="10" fill="#fff0f5"/>
      <path d="M48 42 Q60 32 72 42 L69 70 Q60 79 51 70Z" fill="#fff0f5"/>
      <path d="M52 69 L44 84 M68 69 L76 84" stroke="#fff0f5" stroke-width="5" stroke-linecap="round"/>
      <path d="M72 48 L103 26" stroke="#fff0f5" stroke-width="4"/>
      <path d="M98 23 L108 20 L103 29" fill="none" stroke="#fff0f5" stroke-width="3"/>
    </svg>
  </div>

  <main class="page">
    <header class="headline">
      <span class="small">I LOVE YOU, BEB!</span>
      <h1>To My Favorite Person ❤️</h1>
    </header>

    <section class="photo-wrap">
      <div class="heart-frame" aria-hidden="true">
        <span>♥</span><span>♥</span><span>♥</span><span>♥</span>
      </div>

      <div class="photo-card">
        <img src="cia.jpg" alt="A favorite photo"
             onerror="this.style.objectFit='contain'; this.alt='Add a photo beside this HTML file';">
        <div class="photo-caption">Someone special ♥</div>
      </div>
    </section>

    <section class="glass">
      <p>
        LOVE KITA PALAGI ✨
      </p>

      <button class="heart-button" id="messageButton" type="button">
        <span>Tap for a Message</span>
      </button>

      <p class="hint">THANK YOU FOR BEING THE MOST AMAZING PERSON I KNOW! ✨</p>
    </section>
  </main>

  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="messageTitle">
    <div class="message-card">
      <div class="big-heart">❤️</div>
      <h2 id="messageTitle">A Little Message</h2>
      <p id="typedMessage"></p>
      <button class="close" id="closeButton" type="button">Close ♥</button>
    </div>
  </div>

<script>
(() => {
  const hearts = document.getElementById("hearts");
  const bursts = document.getElementById("bursts");
  const modal = document.getElementById("modal");
  const messageButton = document.getElementById("messageButton");
  const closeButton = document.getElementById("closeButton");
  const typedMessage = document.getElementById("typedMessage");

  // Edit this message to make it personal.
  const message =
    "KISS MO KO WHAHAHAHA♥✨";

  const heartCharacters = ["♥", "❤", "♡"];
  const colors = ["#ff6f9f", "#ff9fbd", "#ffd1df", "#f04f82"];

  function random(min, max) {
    return Math.random() * (max - min) + min;
  }

  function createFloatingHeart() {
    const el = document.createElement("span");
    el.className = "float-heart";
    el.textContent = heartCharacters[Math.floor(Math.random() * heartCharacters.length)];

    el.style.setProperty("--x", random(0, 100) + "vw");
    el.style.setProperty("--size", random(14, 32) + "px");
    el.style.setProperty("--duration", random(6, 11) + "s");
    el.style.setProperty("--drift", random(-90, 90) + "px");
    el.style.setProperty("--rotate", random(-25, 25) + "deg");
    el.style.setProperty("--opacity", random(.35, .85));
    el.style.setProperty("--color", colors[Math.floor(Math.random() * colors.length)]);

    hearts.appendChild(el);
    setTimeout(() => el.remove(), 12000);
  }

  setInterval(createFloatingHeart, 500);
  for (let i = 0; i < 9; i++) {
    setTimeout(createFloatingHeart, i * 180);
  }

  function burst(x, y) {
    for (let i = 0; i < 15; i++) {
      const el = document.createElement("span");
      el.className = "burst-heart";
      el.textContent = heartCharacters[Math.floor(Math.random() * heartCharacters.length)];

      const angle = Math.random() * Math.PI * 2;
      const distance = random(35, 115);

      el.style.setProperty("--x", x + "px");
      el.style.setProperty("--y", y + "px");
      el.style.setProperty("--dx", Math.cos(angle) * distance + "px");
      el.style.setProperty("--dy", Math.sin(angle) * distance + "px");
      el.style.setProperty("--size", random(11, 21) + "px");

      bursts.appendChild(el);
      setTimeout(() => el.remove(), 850);
    }
  }

  function sparkle(x, y) {
    const el = document.createElement("span");
    el.className = "sparkle";
    el.textContent = "✦";
    el.style.left = x + "px";
    el.style.top = y + "px";
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1000);
  }

  document.addEventListener("pointerdown", (event) => {
    if (event.target.closest("button")) return;
    burst(event.clientX, event.clientY);
    sparkle(event.clientX, event.clientY);
  }, { passive: true });

  function typeMessage() {
    typedMessage.textContent = "";
    let i = 0;

    const timer = setInterval(() => {
      if (i >= message.length) {
        clearInterval(timer);
        return;
      }

      typedMessage.textContent += message[i];
      i++;
    }, 25);
  }

  function openModal() {
    modal.classList.add("open");
    typeMessage();
    setTimeout(() => closeButton.focus(), 100);
  }

  function closeModal() {
    modal.classList.remove("open");
  }

  messageButton.addEventListener("click", (event) => {
    event.stopPropagation();
    openModal();
    burst(window.innerWidth / 2, window.innerHeight * .72);
  });

  closeButton.addEventListener("click", closeModal);

  modal.addEventListener("click", (event) => {
    if (event.target === modal) closeModal();
  });

  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") closeModal();
  });
})();
</script>
</body>
</html>
